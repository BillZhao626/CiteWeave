name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.19.0"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --frozen
          pnpm --dir apps/web install --frozen-lockfile
      - name: Backend and frontend offline checks
        run: uv run --frozen python scripts/check_release.py
      - name: Validate Compose without starting services
        if: runner.os == 'Linux'
        run: docker compose --env-file .env.example -f deploy/compose.m0.yml -f deploy/compose.m1.yml config --quiet
