<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1260" viewBox="0 0 1160 1260" role="img" aria-labelledby="title desc">
<title id="title">CiteWeave query and ingestion architecture</title>
<desc id="desc">History and Working State interpret the request. Dense and BM25 retrieval, RRF and BGE rerank form current EvidencePack. Authorized generation, citation validation and atomic Acceptance publish PostgreSQL state. Ingestion uses PostgreSQL jobs, Redis/Celery, LocalBlobStore and a rebuildable Qdrant index; visibility requires a durable READY commit.</desc>
